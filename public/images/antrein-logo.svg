    </defs>

    <!-- Outer open circular ring matching official AntreIn Q+A mark -->
    <path
        d="M 72.6 92.2 A 39 39 0 1 1 89.6 78.9"
        stroke="url(#antrein-brand-grad)"
        stroke-width="11"
