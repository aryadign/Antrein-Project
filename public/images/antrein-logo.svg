           L 66.0 86.2
           C 60.2 79.4 51.8 79.2 44.2 85.4
           L 35.0 74.5
           Z
           M 58.0 55.2
           L 47.6 73.2
           C 54.4 69.2 63.4 70.0 70.6 77.2
           L 86.4 95.6
           C 88.4 97.9 91.6 98.2 93.6 96.4
           C 95.5 94.7 95.4 91.7 93.3 89.6
           C 76.2 73.2 65.4 65.5 58.0 55.2
